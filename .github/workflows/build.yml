name: Build and Release

on:
  push:
    tags:
      - 'v*' # Tự động chạy khi sếp tạo tag version mới (VD: v1.0.5)

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest] # Tự động chạy cả trên máy ảo Windows và macOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build and Publish App
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # 🟢 Tự động lấy token bảo mật từ GitHub Secrets đưa vào lúc build
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Nếu sếp muốn giấu luôn cả key AI
